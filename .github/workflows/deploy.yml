name: Backend CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          # Docker apt + npm install + image export often exceeds default 10m
          command_timeout: 30m
          script: |
            set -e
            cd ~/app/backend

            git pull origin main

            docker compose down || true

            # Free disk BEFORE rebuild — last deploy died with "no space left on device"
            docker builder prune -af || true
            docker image prune -af || true
            docker container prune -f || true
            df -h

            docker compose up -d --build --remove-orphans

            docker image prune -f || true
            df -h
